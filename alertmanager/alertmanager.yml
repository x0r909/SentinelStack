global:
  resolve_timeout: 5m
  smtp_smarthost: ''
  smtp_from: ''
  smtp_require_tls: true

route:
  group_by: ['severity', 'category', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-critical'
  routes:
    - match:
        severity: critical
      receiver: 'telegram-critical'
      continue: false

    - match:
        severity: warning
      receiver: 'telegram-warning'
      group_interval: 10m
      repeat_interval: 12h
      continue: false

    - match:
        severity: info
      receiver: 'telegram-info'
      group_interval: 30m
      repeat_interval: 24h
      continue: false

receivers:
  - name: 'telegram-critical'
    telegram_configs:
      - bot_token: 'TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: TELEGRAM_CHAT_ID
        parse_mode: 'HTML'
        message: |
          <b>🚨 CRITICAL ALERT</b>
          <b>Status:</b> {{ .Status | toUpper }}
          <b>Alert:</b> {{ .CommonLabels.alertname }}
          <b>Instance:</b> {{ .CommonLabels.instance }}
          <b>Category:</b> {{ .CommonLabels.category }}
          
          {{ range .Alerts }}
          <b>Summary:</b> {{ .Annotations.summary }}
          <b>Description:</b> {{ .Annotations.description }}
          {{ end }}
          
          <b>Time:</b> {{ .CommonAnnotations.time }}

  - name: 'telegram-warning'
    telegram_configs:
      - bot_token: 'TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: TELEGRAM_CHAT_ID
        parse_mode: 'HTML'
        message: |
          <b>⚠️ WARNING ALERT</b>
          <b>Status:</b> {{ .Status | toUpper }}
          <b>Alert:</b> {{ .CommonLabels.alertname }}
          <b>Instance:</b> {{ .CommonLabels.instance }}
          
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ end }}

  - name: 'telegram-info'
    telegram_configs:
      - bot_token: 'TELEGRAM_BOT_TOKEN'
        api_url: 'https://api.telegram.org'
        chat_id: TELEGRAM_CHAT_ID
        parse_mode: 'HTML'
        message: |
          <b>ℹ️ INFO</b>
          <b>Alert:</b> {{ .CommonLabels.alertname }}
          {{ range .Alerts }}
          {{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
    target_match_re:
      category: '^(node|proxmox|docker)$'

  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'instance']

templates: []
