x-default-limits: &default-limits
  cpus: '1.0'
  mem_limit: 1g

services:
  grafana:
    image: grafana/grafana:11.2.2
    container_name: sentinel-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-sentinel2024}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - sentinel-net
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    <<: *default-limits

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinel-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus:/etc/prometheus:ro
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    <<: *default-limits

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sentinel-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager:/etc/alertmanager:ro
    networks:
      - sentinel-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  loki:
    image: grafana/loki:3.1.1
    container_name: sentinel-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki_data:/loki
      - ./loki:/etc/loki:ro
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    <<: *default-limits

  promtail:
    image: grafana/promtail:3.1.1
    container_name: sentinel-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - sentinel-net
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.15
    container_name: sentinel-uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    <<: *default-limits

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sentinel-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: sentinel-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,network,tcp,udp,percpu,sched,process'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.0.1
    container_name: sentinel-pve-exporter
    restart: unless-stopped
    ports:
      - "${PVE_EXPORTER_PORT:-9221}:9221"
    environment:
      - PVE_USER=${PVE_USER:-root@pam}
      - PVE_PASSWORD=${PVE_PASSWORD}
      - PVE_VERIFY_SSL=${PVE_VERIFY_SSL:-false}
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256m

networks:
  sentinel-net:
    driver: bridge
    name: sentinel-stack

volumes:
  grafana_data:
    name: sentinel-grafana-data
  prometheus_data:
    name: sentinel-prometheus-data
  alertmanager_data:
    name: sentinel-alertmanager-data
  loki_data:
    name: sentinel-loki-data
  uptime_kuma_data:
    name: sentinel-uptime-kuma-data
