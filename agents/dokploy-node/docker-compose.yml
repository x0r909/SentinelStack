services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sentinel-agent-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - sentinel-agent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: '0.3'
    mem_limit: 256m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: sentinel-agent-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--disable_metrics=percpu,sched,process'
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - sentinel-agent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: '0.5'
    mem_limit: 512m

  alloy:
    image: grafana/alloy:v0.2.0
    container_name: sentinel-agent-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      - LOKI_URL=${LOKI_URL:?Set LOKI_URL in .env}
      - NODE_HOSTNAME=${NODE_HOSTNAME:-dokploy-server}
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sentinel-agent-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:12345/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    cpus: '0.3'
    mem_limit: 256m

networks:
  sentinel-agent-net:
    driver: bridge
    name: sentinel-agent

volumes:
  alloy_data:
    name: sentinel-agent-alloy-data
