services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sentinel-agent-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - sentinel-agent-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: sentinel-agent-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    command:
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--disable_metrics=disk,network,tcp,udp,percpu,sched,process'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - sentinel-agent-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  promtail:
    image: grafana/promtail:3.1.1
    container_name: sentinel-agent-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - sentinel-agent-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256m

networks:
  sentinel-agent-net:
    driver: bridge
    name: sentinel-agent
