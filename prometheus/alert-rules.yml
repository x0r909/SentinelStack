groups:
  - name: sentinel-stack.node-alerts
    rules:
      - alert: NodeHighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          category: node
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)"

      - alert: NodeCriticalCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 3m
        labels:
          severity: critical
          category: node
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 95%)"

      - alert: NodeHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: node
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)"

      - alert: NodeCriticalMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 3m
        labels:
          severity: critical
          category: node
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% (threshold: 95%)"

      - alert: NodeDiskSpaceWarning
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|nsfs"})) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: node
        annotations:
          summary: "Disk space warning on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full (threshold: 85%)"

      - alert: NodeDiskSpaceCritical
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|nsfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|nsfs"})) * 100 > 95
        for: 3m
        labels:
          severity: critical
          category: node
        annotations:
          summary: "Disk space critical on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full (threshold: 95%)"

      - alert: NodeLoadHigh
        expr: node_load15 / on(instance) count(node_cpu_seconds_total{mode="idle"}) by (instance) > 2
        for: 5m
        labels:
          severity: warning
          category: node
        annotations:
          summary: "High load average on {{ $labels.instance }}"
          description: "15-minute load average is {{ $value | printf \"%.2f\" }}x CPU cores"

  - name: sentinel-stack.proxmox-alerts
    rules:
      - alert: ProxmoxNodeOffline
        expr: up{job="proxmox"} == 0
        for: 1m
        labels:
          severity: critical
          category: proxmox
        annotations:
          summary: "Proxmox node {{ $labels.instance }} is unreachable"
          description: "Unable to scrape metrics from Proxmox node {{ $labels.instance }}"

      - alert: ProxmoxVMDown
        expr: pve_vm_status{status="stopped"} == 1
        for: 5m
        labels:
          severity: warning
          category: proxmox
        annotations:
          summary: "VM {{ $labels.name }} is stopped on {{ $labels.instance }}"
          description: "VM {{ $labels.vmid }} ({{ $labels.name }}) has been stopped for more than 5 minutes"

      - alert: ProxmoxLXCDown
        expr: pve_lxc_status{status="stopped"} == 1
        for: 5m
        labels:
          severity: warning
          category: proxmox
        annotations:
          summary: "LXC {{ $labels.name }} is stopped on {{ $labels.instance }}"
          description: "LXC {{ $labels.vmid }} ({{ $labels.name }}) has been stopped for more than 5 minutes"

      - alert: ProxmoxHighCPU
        expr: pve_node_cpu_usage * 100 > 90
        for: 5m
        labels:
          severity: warning
          category: proxmox
        annotations:
          summary: "High CPU on Proxmox node {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}%"

      - alert: ProxmoxHighMemory
        expr: pve_node_memory_usage * 100 > 90
        for: 5m
        labels:
          severity: warning
          category: proxmox
        annotations:
          summary: "High memory on Proxmox node {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}%"

      - alert: ProxmoxStorageCritical
        expr: (pve_storage_used_bytes / pve_storage_total_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
          category: proxmox
        annotations:
          summary: "Storage {{ $labels.storage }} critical on {{ $labels.instance }}"
          description: "Storage is {{ $value | printf \"%.1f\" }}% full"

  - name: sentinel-stack.docker-alerts
    rules:
      - alert: DockerContainerDown
        expr: container_tasks_state{state="running"} == 0
        for: 2m
        labels:
          severity: warning
          category: docker
        annotations:
          summary: "Container {{ $labels.name }} is not running"
          description: "Container {{ $labels.name }} on {{ $labels.instance }} has 0 running tasks"

      - alert: DockerContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: docker
        annotations:
          summary: "Container {{ $labels.name }} high CPU"
          description: "Container CPU usage is {{ $value | printf \"%.1f\" }}%"

      - alert: DockerContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: docker
        annotations:
          summary: "Container {{ $labels.name }} high memory"
          description: "Container memory usage is {{ $value | printf \"%.1f\" }}%"

      - alert: DockerContainerRestartLoop
        expr: increase(container_restart_count[1h]) > 5
        for: 1m
        labels:
          severity: critical
          category: docker
        annotations:
          summary: "Container {{ $labels.name }} in restart loop"
          description: "Container restarted {{ $value }} times in the last hour"

  - name: sentinel-stack.service-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          category: service
        annotations:
          summary: "Service {{ $labels.job }} down on {{ $labels.instance }}"
          description: "{{ $labels.job }} has been unreachable for more than 2 minutes"

      - alert: PrometheusTargetMissing
        expr: count by(job) (up == 0) > 3
        for: 5m
        labels:
          severity: warning
          category: service
        annotations:
          summary: "Multiple targets down for {{ $labels.job }}"
          description: "{{ $value }} targets are unreachable for job {{ $labels.job }}"

      - alert: PrometheusTSDBCompactionsFailing
        expr: increase(prometheus_tsdb_compactions_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          category: service
        annotations:
          summary: "Prometheus TSDB compaction failing"
          description: "Prometheus TSDB compaction has failed {{ $value }} times in the last hour"

      - alert: AlertmanagerConfigFailed
        expr: alertmanager_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
          category: service
        annotations:
          summary: "Alertmanager configuration reload failed"
          description: "Alertmanager failed to reload its configuration"

  - name: sentinel-stack.storage-alerts
    rules:
      - alert: PrometheusStorageNearLimit
        expr: (prometheus_tsdb_storage_blocks_bytes / prometheus_tsdb_retention_limit_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Prometheus storage nearing limit"
          description: "Prometheus storage is {{ $value | printf \"%.1f\" }}% of retention limit"

      - alert: LokiStorageNearLimit
        expr: loki_ingester_chunks_stored_bytes / (30 * 1024 * 1024 * 1024) > 0.8
        for: 5m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "Loki storage high"
          description: "Loki storage usage is high"
