global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: 'sentinel-stack'
    env: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

# File-based service discovery:
# - Tambah node baru = buat file YAML baru di targets/, tanpa edit config utama
# - Prometheus auto-reload file_sd setiap 5 detik (default refresh_interval)
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'sentinel-prometheus'
          host_type: 'monitoring'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          instance: 'sentinel-alertmanager'
          host_type: 'monitoring'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          instance: 'sentinel-grafana'
          host_type: 'monitoring'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          instance: 'sentinel-loki'
          host_type: 'monitoring'

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          instance: 'sentinel-tempo'
          host_type: 'monitoring'

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']
        labels:
          instance: 'sentinel-alloy'
          host_type: 'monitoring'

  - job_name: 'node-exporter-local'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'sentinel-monitoring-host'
          host_type: 'monitoring'

  - job_name: 'cadvisor-local'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'sentinel-monitoring-host'
          host_type: 'monitoring'
    metrics_path: /metrics
    scheme: http

  - job_name: 'pve-exporter'
    metrics_path: /pve
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/pve-exporters.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
      - target_label: job
        replacement: proxmox

  - job_name: 'node-exporter-remote'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node-exporters.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance

  - job_name: 'cadvisor-remote'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor-remote.yml
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'dokploy-docker'

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://grafana:3000'
          - 'http://prometheus:9090'
          - 'http://alertmanager:9093'
          - 'http://loki:3100'
          - 'http://tempo:3200'
          - 'http://uptime-kuma:3001'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
