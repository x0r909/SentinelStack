global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: 'sentinel-stack'
    env: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'sentinel-prometheus'
          host_type: 'monitoring'

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          instance: 'sentinel-alertmanager'
          host_type: 'monitoring'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          instance: 'sentinel-grafana'
          host_type: 'monitoring'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          instance: 'sentinel-loki'
          host_type: 'monitoring'

  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['uptime-kuma:3001']
        labels:
          instance: 'sentinel-uptime-kuma'
          host_type: 'monitoring'

  - job_name: 'node-exporter-local'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'sentinel-monitoring-host'
          host_type: 'monitoring'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: node-exporter:9100

  - job_name: 'cadvisor-local'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'sentinel-monitoring-host'
          host_type: 'monitoring'
    metrics_path: /metrics
    scheme: http

  - job_name: 'pve-exporter'
    metrics_path: /pve
    static_configs:
      - targets:
          - 'pve-exporter:9221'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
      - target_label: job
        replacement: proxmox

  - job_name: 'node-exporter-remote'
    static_configs:
      - targets:
          - 'PROXMOX_NODE1_IP:9100'
          - 'PROXMOX_NODE2_IP:9100'
          - 'DOKPLOY_IP:9100'
        labels:
          host_type: 'remote'
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        replacement: '${1}'
        target_label: node_ip
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance

  - job_name: 'cadvisor-remote-dokploy'
    static_configs:
      - targets:
          - 'DOKPLOY_IP:8080'
        labels:
          host_type: 'remote'
          server: 'dokploy'
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'dokploy-docker'

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://grafana:3000'
          - 'http://prometheus:9090'
          - 'http://alertmanager:9093'
          - 'http://loki:3100'
          - 'http://uptime-kuma:3001'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
